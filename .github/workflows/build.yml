name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;37.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)"
          mkdir -p dist
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | tee dist/signature.txt
          cp app/build/outputs/apk/release/*.apk dist/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SpoofMyDevice-eSIM-release
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish signed release
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: SpoofMyDevice-eSIM-release
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION_NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n1)"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION_NAME}-esim.${VERSION_CODE}"
          fi

          APK="SpoofMyDevice-eSIM-${VERSION_NAME}-signed.apk"
          mv dist/*.apk "dist/${APK}"
          SHA256="$(sha256sum "dist/${APK}" | awk '{print $1}')"
          CERT_SHA256="$(grep -m1 'certificate SHA-256 digest' dist/signature.txt | awk '{print $NF}' || true)"

          cat > release-notes.md <<EOF
          Release-signed APK built, verified and signed in GitHub Actions.

          - Version: \`${VERSION_NAME}\` (\`${VERSION_CODE}\`)
          - SHA-256: \`${SHA256}\`
          - Signing certificate SHA-256: \`${CERT_SHA256}\`
          - Commit: \`${GITHUB_SHA}\`

          ### eSIM / physical eUICC

          - Real framework card, subscription, EID and \`EuiccManager\` state are preserved when present.
          - Telephony and eUICC spoofing is skipped for LPA packages so the module cannot hide a removable card.
          - Use NekokoLPA2's privileged Telephony (TMAPI) reader on ROMs without OMAPI.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/${APK}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "SpoofMyDevice ${VERSION_NAME} eSIM (signed)" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" "dist/${APK}" --repo "$GITHUB_REPOSITORY" \
              --title "SpoofMyDevice ${VERSION_NAME} eSIM (signed)" \
              --notes-file release-notes.md
          fi
          echo "Published $TAG"
